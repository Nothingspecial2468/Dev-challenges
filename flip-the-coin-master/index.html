<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Flip the coin | devChallenges.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <h1>Flip the coin</h1>
      <p class="instructions">Press the coin or the button to flip the coin</p>
     
      <button type="button" class="flip-btn">
      <img src="resources/heads.svg"
      alt="Heads"
      class="coin"
      id="coin" />
      </button>

      <img src="resources/shadow.svg" alt="" class="shadow"/>

      <p id="result">Heads</p>

      <button type="button" class="random-btn">RANDOM</button>

    </main>

    <div class="author-info">
      Coded by <a href="#">Neha</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>

    <script src="script.js"></script>
  </body>
</html>
