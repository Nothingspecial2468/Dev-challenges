<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Join Our Newsletter | devChallenges.io</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
        padding: 48px 24px;
        color: #000;
      }

      .container {
        width: 100%;
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      .content {
        width: 100%;
        max-width: 720px;
        margin: 0 auto 64px;
      }

      .content img {
        display: block;
        width: 40px;
        height: 40px;
        margin: 0 auto 32px;
      }

      .content h1 {
        font-size: 48px;
        line-height: 1.2;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .content p {
        font-size: 20px;
        line-height: 1.5;
        color: #6c727f;
      }

      .input-container {
        width: 100%;
        max-width: 552px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
        border: 1px solid #f3f4f6;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .input-container input {
        width: 100%;
        min-height: 60px;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        text-align: center;
        font: inherit;
        font-size: 16px;
        color: #394150;
        background-color: #f9fafb;
      }

      .input-container input:focus-visible,
      .input-container button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .input-container button {
        width: 100%;
        min-height: 58px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        background-color: #284bce;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
      }

      .input-container button:hover {
        background-color: #3c5ff5;
      }

      .input-container p {
        font-size: 14px;
        line-height: 1.4;
        color: #394150;
      }

      @media (max-width: 600px) {
        .content {
          max-width: 350px;
        }

        .content h1 {
          font-size: 32px;
        }

        .content p {
          font-size: 16px;
          line-height: 1.5;
        }

        .input-container p {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="content">
        <img src="resources/logo.svg" alt="" />
        <h1>Join our newsletter</h1>
        <p>
          Keep up with our latest collections, exclusive deals, and special
          offers! We introduce a new collection every week, so stay tuned to
          snag the hottest items just for you.
        </p>
      </section>

      <form class="input-container">
        <label class="visually-hidden" for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        />
        <button type="submit">Subscribe now</button>
        <p>Your email is 100% confidential and won't send you any spam.</p>
      </form>
    </main>
  </body>
</html>
